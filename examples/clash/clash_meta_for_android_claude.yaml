# 自动生成，请编辑 claude.yaml 后运行 generate_claude_configs.py；不要手改此文件。
# CMFA：导入本地配置；VPN 授权及网络 IPv6/访问控制仍需客户端设置。
# 需要 Mihomo v1.19.19+；机场仅供应节点。
mixed-port: 7893
mode: rule
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
profile:
  store-selected: false
proxy-providers:
  airport:
    type: http
    proxy: DIRECT
    url: https://dasho.pqjc.site/api/v1/pq/d761660cde1f95110837c20747717a81
    path: ./providers/airport.yaml
    interval: 86400
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 300
    exclude-filter: (?i)(剩余|流量|到期|过期|官网|套餐|重置|Expire|Traffic)
proxy-groups:
- name: 节点选择
  type: select
  url: https://cp.cloudflare.com/generate_204
  proxies:
  - 自动选择
  - 日本节点自动选择
  - 美国节点自动选择
  - 新加坡节点自动选择
  - 台湾节点自动选择
  use:
  - airport
  exclude-type: Direct|Compatible|Pass|PassRule
  empty-fallback: REJECT
- name: Claude
  type: select
  url: https://cp.cloudflare.com/generate_204
  proxies:
  - 美国节点自动选择
  - 日本节点自动选择
  - 新加坡节点自动选择
  - 台湾节点自动选择
  use:
  - airport
  exclude-type: Direct|Compatible|Pass|PassRule
  empty-fallback: REJECT
- name: 日本节点自动选择
  type: url-test
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  timeout: 3000
  tolerance: 50
  use:
  - airport
  exclude-type: Direct|Compatible|Pass|PassRule
  filter: (?i)(🇯🇵|日本|Japan|东京|東京|Tokyo|大阪|Osaka|(^|[^A-Za-z])(JP|JPN|TYO|KIX)([^A-Za-z]|$))
  proxies:
  - REJECT
  empty-fallback: REJECT
- name: 美国节点自动选择
  type: url-test
  url: https://cp.cloudflare.com/generate_204
  interval: 600
  timeout: 3000
  tolerance: 200
  use:
  - airport
  exclude-type: Direct|Compatible|Pass|PassRule
  filter: (?i)(🇺🇸|美国|美國|United ?States|\bUSA?\b|圣何塞|San ?Jose|SJC|洛杉矶|Los ?Angeles|LAX|西雅图|Seattle|硅谷)
  proxies:
  - REJECT
  empty-fallback: REJECT
- name: 新加坡节点自动选择
  type: url-test
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  timeout: 3000
  tolerance: 50
  use:
  - airport
  exclude-type: Direct|Compatible|Pass|PassRule
  filter: (?i)(🇸🇬|新加坡|狮城|獅城|Singapore|(^|[^A-Za-z])(SG|SGP|SIN)([^A-Za-z]|$))
  proxies:
  - REJECT
  empty-fallback: REJECT
- name: 台湾节点自动选择
  type: url-test
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  timeout: 3000
  tolerance: 50
  use:
  - airport
  exclude-type: Direct|Compatible|Pass|PassRule
  filter: (?i)(🇹🇼|台湾|台灣|臺灣|台北|臺北|Taiwan|Taipei|高雄|Kaohsiung|(^|[^A-Za-z])(TW|TWN|TPE|KHH)([^A-Za-z]|$))
  proxies:
  - REJECT
  empty-fallback: REJECT
- name: 自动选择
  type: url-test
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  tolerance: 50
  use:
  - airport
  exclude-type: Direct|Compatible|Pass|PassRule
  proxies:
  - REJECT
  empty-fallback: REJECT
rule-providers:
  claude-processes:
    type: inline
    behavior: classical
    payload:
    - PROCESS-NAME,com.anthropic.claude
    - PROCESS-NAME,Claude.exe
    - PROCESS-NAME,Code.exe
    - PROCESS-NAME,Code - Insiders.exe
    - PROCESS-PATH-REGEX,(?i)^/.*/Claude\.app/Contents/.*$
    - PROCESS-PATH-REGEX,(?i)^/.*/Visual Studio Code( - Insiders)?\.app/Contents/.*$
    - PROCESS-NAME,claude
    - PROCESS-PATH-REGEX,^/.*/\.local/share/claude/versions/[^/]+$
    - PROCESS-PATH-REGEX,^/.*/\.vscode(-server)?(-insiders)?/extensions/anthropic\.claude-code-[^/]+/resources/(native-binary|native-binaries/[^/]+)/claude$
    - PROCESS-PATH-REGEX,^/.*/\.vscode-server(-insiders)?/(bin/[^/]+|cli/servers/[^/]+/server)/node$
    - AND,((IN-PORT,7893),(PROCESS-NAME,ssh))
    - AND,((IN-PORT,7893),(PROCESS-NAME,ssh.exe))
  claude-domains:
    type: inline
    behavior: domain
    payload:
    - +.claude.ai
    - +.claude.com
    - +.anthropic.com
    - +.claudeusercontent.com
    - +.claude.app
    - +.claudemcpcontent.com
    - +.withpersona.com
    - +.yoti.com
  direct-domains:
    type: inline
    behavior: domain
    payload:
    - +.nanocorechip.com
  direct-processes:
    type: inline
    behavior: classical
    payload:
    - PROCESS-NAME,com.tencent.mm
    - PROCESS-NAME,com.eg.android.AlipayGphone
    - PROCESS-NAME,com.icbc
    - PROCESS-NAME,com.chinamworld.main
    - PROCESS-NAME,com.android.bankabc
    - PROCESS-NAME,com.chinamworld.bocmbci
    - PROCESS-NAME,com.bankcomm.Bankcomm
    - PROCESS-NAME,com.yitong.mbank.psbc
    - PROCESS-NAME,cmb.pb
    - PROCESS-NAME,cn.com.hzb.mobilebank.per
    - PROCESS-NAME,com.hexin.plat.android
    - PROCESS-NAME,com.galaxy.stock
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports:
      - 80
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
      - 8443
dns:
  enable: true
  ipv6: true
  enhanced-mode: redir-host
  respect-rules: false
  default-nameserver:
  - 223.5.5.5
  nameserver:
  - https://1.1.1.1/dns-query#节点选择
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query
  direct-nameserver:
  - https://223.5.5.5/dns-query
  direct-nameserver-follow-policy: false
  nameserver-policy:
    rule-set:claude-domains:
    - https://1.1.1.1/dns-query#Claude&disable-ipv6=true&disable-qtype-65=true
    geosite:cn:
    - https://223.5.5.5/dns-query
rules:
- AND,((RULE-SET,claude-domains),(IP-CIDR6,::/0,no-resolve)),REJECT
- RULE-SET,direct-domains,DIRECT
- RULE-SET,claude-processes,Claude
- RULE-SET,claude-processes,REJECT
- RULE-SET,claude-domains,Claude
- RULE-SET,claude-domains,REJECT
- GEOIP,private,DIRECT,no-resolve
- GEOSITE,cn,DIRECT
- RULE-SET,direct-processes,DIRECT
- MATCH,节点选择
- MATCH,REJECT
clash-for-android:
  append-system-dns: false
