    - PROCESS-NAME,com.hexin.plat.android
    - PROCESS-NAME,com.galaxy.stock
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports:
      - 80
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
      - 8443
dns:
  enable: true
  ipv6: true
  enhanced-mode: redir-host
  respect-rules: false
  default-nameserver:
  - 223.5.5.5
  nameserver:
  - https://1.1.1.1/dns-query#节点选择
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query
  direct-nameserver:
  - https://223.5.5.5/dns-query
  direct-nameserver-follow-policy: false
  nameserver-policy:
    rule-set:ai-ipv4-domains:
    - https://1.1.1.1/dns-query#节点选择&disable-ipv6=true&disable-qtype-65=true
    geosite:cn:
    - https://223.5.5.5/dns-query
rules:
- AND,((RULE-SET,ai-ipv4-domains),(IP-CIDR6,::/0,no-resolve)),REJECT
- RULE-SET,direct-domains,DIRECT
- RULE-SET,loopback,DIRECT
- RULE-SET,ai-ipv4-domains,节点选择
- RULE-SET,ai-ipv4-domains,REJECT
- RULE-SET,claude-processes,节点选择
- RULE-SET,claude-processes,REJECT
- GEOIP,private,DIRECT,no-resolve
- GEOSITE,cn,DIRECT
- RULE-SET,direct-processes,DIRECT
- MATCH,节点选择
- MATCH,REJECT
clash-for-android:
  append-system-dns: false
