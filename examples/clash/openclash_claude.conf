# 自动生成，请编辑 claude.yaml 后运行 generate_claude_configs.py；不要手改此文件。
# OpenClash 原生兼容模块，仅关联 openclash_claude.yaml 后启用。
# General 覆盖当前运行参数；YAML 恢复共同嗅探和节点 DNS 策略，保留插件 DNS 监听。
[General]
CORE_TYPE=Meta
EN_MODE=redir-host-mix
PROXY_MODE=rule
MIXED_PORT=7893
ENABLE_UDP_PROXY=1
DISABLE_UDP_QUIC=0
ROUTER_SELF_PROXY=1
ENABLE_REDIRECT_DNS=1
CHINA_IP_ROUTE=0
CHINA_IP6_ROUTE=0
COMMON_PORTS=0
ENABLE_RULE_PROXY=0
IPV6_ENABLE=1
IPV6_DNS=1
IPV6_MODE=3
AUTO_SMART_SWITCH=0
FIND_PROCESS_MODE=off
ENABLE_CUSTOM_DNS=0
CUSTOM_NAME_POLICY=0
CUSTOM_FALLBACK_FILTER=0
CUSTOM_FAKEIP_FILTER=0
APPEND_WAN_DNS=0
APPEND_DEFAULT_DNS=0
ENABLE_RESPECT_RULES=0
ENABLE_CUSTOM_CLASH_RULES=0
ENABLE_META_SNIFFER=1
ENABLE_META_SNIFFER_CUSTOM=0
ENABLE_META_SNIFFER_PURE_IP=1
ENABLE_TCP_CONCURRENT=1
ENABLE_UNIFIED_DELAY=1
GITHUB_ADDRESS_MOD=0
URLTEST_ADDRESS_MOD=0
URLTEST_INTERVAL_MOD=0
TOLERANCE=0

[YAML]
sniffer!:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports:
      - 80
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
      - 8443
dns:
  proxy-server-nameserver-policy!: {}
