<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="5100" viewBox="0 0 2200 5100" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek-V4-Flash TP8PP1 Decode 算子与 Shape 推导流程图</title>
  <desc id="desc">展示 batch 16 的 decode execute 中，从 embedding、L0 broadcast MHC pre、层间 fused post-pre、43 层 Attention、MoE、TP/EP All-Reduce 到最终归一化的算子、shape 和推导公式。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#475569"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#c2410c"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <style>
      .title { font: 700 42px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 23px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .section { font: 700 27px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .head { font: 700 25px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .body { font: 400 21px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #1e293b; }
      .small { font: 400 18px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .mono { font: 500 20px "DejaVu Sans Mono", monospace; fill: #0f172a; }
      .monoSmall { font: 500 17px "DejaVu Sans Mono", monospace; fill: #334155; }
      .inverse { fill: #ffffff; }
      .box { stroke-width: 2.5; rx: 18; filter: url(#shadow); }
      .config { fill: #eef2ff; stroke: #6366f1; }
      .compute { fill: #e0f2fe; stroke: #0284c7; }
      .attention { fill: #ede9fe; stroke: #7c3aed; }
      .c4 { fill: #f5f3ff; stroke: #8b5cf6; }
      .c128 { fill: #fdf4ff; stroke: #c026d3; }
      .moe { fill: #dcfce7; stroke: #16a34a; }
      .comm { fill: #ffedd5; stroke: #ea580c; }
      .runtime { fill: #fef9c3; stroke: #ca8a04; }
      .neutral { fill: #ffffff; stroke: #64748b; }
      .warn { fill: #fff1f2; stroke: #e11d48; }
      .cluster { fill: #ffffff; fill-opacity: .62; stroke: #94a3b8; stroke-width: 2.5; stroke-dasharray: 12 8; rx: 26; }
      .line { fill: none; stroke: #475569; stroke-width: 3.5; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #c2410c; stroke-width: 4; stroke-dasharray: 12 8; marker-end: url(#arrowOrange); }
      .divider { stroke: #cbd5e1; stroke-width: 2; }
    </style>
  </defs>

  <rect x="0" y="0" width="2200" height="5100" fill="#f8fafc"/>

  <text x="1100" y="65" text-anchor="middle" class="title">DeepSeek‑V4‑Flash · TP8 / PP1 / EP8 · Decode 算子与 Shape 因果链</text>
  <text x="1100" y="108" text-anchor="middle" class="subtitle">数据：execute_16_context_0_generation_16；B=16，43 层，平均 KV 长度≈4099.125；Events sequence 示例为 PID/TID 11060</text>

  <!-- Configuration panel -->
  <rect x="70" y="145" width="2060" height="255" class="box config"/>
  <text x="105" y="188" class="section">决定 Shape 的结构参数</text>
  <line x1="105" y1="205" x2="2095" y2="205" class="divider"/>
  <text x="115" y="245" class="body">模型：</text>
  <text x="235" y="245" class="mono">L=43 · H=4096 · heads=64 · head_dim=512 · q/o_lora=1024 · rope_dim=64</text>
  <text x="115" y="285" class="body">MoE：</text>
  <text x="235" y="285" class="mono">experts=256 · top_k=6 · shared=1 · intermediate=2048 · hash_layers=3</text>
  <text x="115" y="325" class="body">并行：</text>
  <text x="235" y="325" class="mono">TP=8 · PP=1 · EP=8 → local_heads=64/8=8，local_experts=256/8=32</text>
  <text x="115" y="365" class="body">运行：</text>
  <text x="235" y="365" class="mono">B=16 · block_size=256 · max_model_len=200000 · max_batched_tokens=16384</text>

  <!-- Legend -->
  <text x="80" y="455" class="section">图例</text>
  <rect x="175" y="425" width="180" height="46" rx="12" class="compute"/><text x="265" y="455" text-anchor="middle" class="small">通用计算</text>
  <rect x="375" y="425" width="180" height="46" rx="12" class="attention"/><text x="465" y="455" text-anchor="middle" class="small">Attention</text>
  <rect x="575" y="425" width="180" height="46" rx="12" class="moe"/><text x="665" y="455" text-anchor="middle" class="small">MoE</text>
  <rect x="775" y="425" width="180" height="46" rx="12" class="comm"/><text x="865" y="455" text-anchor="middle" class="small">TP/EP 通信</text>
  <rect x="975" y="425" width="215" height="46" rx="12" class="runtime"/><text x="1082" y="455" text-anchor="middle" class="small">容量/调度 Shape</text>
  <text x="1230" y="455" class="small">空 []=标量；DeepGEMM 权重通常显示 [N,K]；Marlin 权重是 packed 物理布局</text>

  <!-- Start -->
  <rect x="665" y="520" width="870" height="105" class="box neutral"/>
  <text x="1100" y="562" text-anchor="middle" class="head">进入选中的纯 Decode execute</text>
  <text x="1100" y="598" text-anchor="middle" class="mono">generation_sq=16 → 本步 16 个请求各生成 1 token</text>

  <path d="M1100 625 L1100 680" class="line"/>
  <rect x="665" y="680" width="870" height="115" class="box compute"/>
  <text x="1100" y="723" text-anchor="middle" class="head">输入 token IDs</text>
  <text x="1100" y="762" text-anchor="middle" class="mono">input_ids [B] = [16]</text>

  <path d="M1100 795 L1100 850" class="line"/>
  <rect x="520" y="850" width="1160" height="180" class="box compute"/>
  <text x="1100" y="895" text-anchor="middle" class="head">Vocab Parallel Embedding · Events #448/#449</text>
  <text x="1100" y="935" text-anchor="middle" class="mono">weight [V/TP,H] = [129280/8,4096] = [16160,4096]</text>
  <text x="1100" y="972" text-anchor="middle" class="mono">[16] → local embedding [16,4096]</text>
  <text x="1100" y="1004" text-anchor="middle" class="small">每个 rank 只拥有词表的 1/8；非本 rank token 位置为 0</text>

  <path d="M1100 1030 L1100 1085" class="line"/>
  <rect x="660" y="1085" width="880" height="120" class="box comm"/>
  <text x="1100" y="1130" text-anchor="middle" class="head">Embedding TP All‑Reduce · Events #457/#460</text>
  <text x="1100" y="1170" text-anchor="middle" class="mono">8 ranks × partial [16,4096] → replicated [16,4096]</text>

  <!-- Layer loop cluster -->
  <rect x="35" y="1260" width="2130" height="3420" class="cluster"/>
  <text x="75" y="1310" class="section">Decoder Layer 循环：L0…L42，共 43 次（PP1：每个 TP rank 都执行全部 43 层）</text>

  <!-- L0 has a special broadcast pre path; only later layers use fused post-pre here. -->
  <path d="M1100 1205 L1100 1328 L565 1328 L565 1360" class="line"/>
  <rect x="120" y="1360" width="890" height="185" class="box compute"/>
  <text x="565" y="1403" text-anchor="middle" class="head">仅 L0：Broadcast MHC pre + Attention RMSNorm</text>
  <text x="565" y="1438" text-anchor="middle" class="monoSmall">x [16,4096] → residual [16,4,4096]</text>
  <text x="565" y="1471" text-anchor="middle" class="monoSmall">fn_broadcast [24,4096] → post [16,4,1] · comb [16,4,4]</text>
  <text x="565" y="1503" text-anchor="middle" class="small">Events #461–#471；两颗裸 GPU kernel 无 CPU Events sequence</text>
  <text x="565" y="1530" text-anchor="middle" class="small">输出 x_attn 仍为 [16,4096]；此处不是 fused post-pre</text>

  <rect x="1190" y="1360" width="890" height="185" class="box compute"/>
  <text x="1635" y="1403" text-anchor="middle" class="head">L1–L42：FFN→Attention fused post-pre + RMSNorm</text>
  <text x="1635" y="1438" text-anchor="middle" class="monoSmall">x_ffn [16,4096] + residual [16,4,4096]</text>
  <text x="1635" y="1471" text-anchor="middle" class="monoSmall">fn [24,16384] → residual′ / post′ / comb′ / x_attn [16,4096]</text>
  <text x="1635" y="1503" text-anchor="middle" class="small">L0–L41 的 MoE 输出回到这里，共执行 42 次</text>
  <text x="1635" y="1530" text-anchor="middle" class="small">GPU：mhc_fused_tilelang + mhc_pre_big_fuse_with_norm</text>

  <path d="M565 1545 L565 1560 L1100 1560 L1100 1570" class="branch"/>
  <path d="M1635 1545 L1635 1560 L1100 1560 L1100 1570" class="branch"/>
  <rect x="445" y="1570" width="1310" height="215" class="box attention"/>
  <text x="1100" y="1615" text-anchor="middle" class="head">Attention 公共输入投影（L0 首例 Events #474；PID/TID 11060 · Stream 23）</text>
  <text x="1100" y="1655" text-anchor="middle" class="mono">fused_wqa_wkv: [16,4096] × [1536,4096] → [16,1536]</text>
  <text x="1100" y="1692" text-anchor="middle" class="monoSmall">1536 = q_lora 1024 + KV latent 512；FP8 scale [12,32]=[1536/128,4096/128]</text>
  <text x="1100" y="1729" text-anchor="middle" class="mono">wq_b: [16,1024] × [4096,1024] → [16,4096] = [16,8 heads×512]</text>
  <text x="1100" y="1760" text-anchor="middle" class="small">fused qnorm/RoPE/KV insert 把实际 8 heads pad 成 FlashMLA 所需的 64 heads</text>

  <!-- Branch to layer types -->
  <path d="M1100 1785 L1100 1845 L350 1845 L350 1900" class="branch"/>
  <path d="M1100 1785 L1100 1900" class="branch"/>
  <path d="M1100 1785 L1100 1845 L1850 1845 L1850 1900" class="branch"/>

  <rect x="65" y="1900" width="570" height="420" class="box attention"/>
  <text x="350" y="1945" text-anchor="middle" class="head">SWA-only：L0–L1（2 层）</text>
  <text x="95" y="1990" class="body">动作：只使用滑动窗口 KV</text>
  <text x="95" y="2030" class="monoSmall">compress_ratio=max(1,0)=1</text>
  <text x="95" y="2070" class="monoSmall">SWA indices [16,1,128]</text>
  <text x="95" y="2110" class="monoSmall">无 extra compressed cache</text>
  <text x="95" y="2160" class="body">sparse_decode_fwd 主输入：</text>
  <text x="95" y="2200" class="monoSmall">Q [16,1,64,512]</text>
  <text x="95" y="2240" class="monoSmall">SWA cache [113444,64,1,584]</text>
  <text x="95" y="2280" class="small">调用：2/rank，整个文件 16</text>

  <rect x="705" y="1870" width="790" height="510" class="box c4"/>
  <text x="1100" y="1915" text-anchor="middle" class="head">C4A：L2,4,…,42（21 层）</text>
  <text x="735" y="1955" class="body">四路 GEMM 并行，然后汇合：</text>
  <text x="735" y="1995" class="monoSmall">主流23  fused_wqa_wkv → [16,1536]</text>
  <text x="735" y="2030" class="monoSmall">辅流35  compressor [16,4096]×[4096,2048]</text>
  <text x="735" y="2065" class="monoSmall">辅流39  index weights [16,4096]×[4096,64]</text>
  <text x="735" y="2100" class="monoSmall">辅流43  index compressor [16,4096]×[4096,512]</text>
  <text x="735" y="2145" class="monoSmall">index q: [16,1024]×[8192,1024] → [16,64,128]</text>
  <text x="735" y="2180" class="monoSmall">8192=64 index heads×128；indexer 在 TP ranks 上复制</text>
  <text x="735" y="2225" class="monoSmall">cooperative_topk: [16,50000] → [16,512]</text>
  <text x="735" y="2260" class="monoSmall">50000=200000/4；512=index_topk</text>
  <text x="735" y="2305" class="monoSmall">extra cache [113444,64,1,584]；64=256/4</text>
  <text x="735" y="2340" class="small">调用：21/rank，整个文件 168</text>

  <rect x="1565" y="1900" width="570" height="420" class="box c128"/>
  <text x="1850" y="1945" text-anchor="middle" class="head">C128A：L3,5,…,41（20 层）</text>
  <text x="1595" y="1990" class="body">动作：高压缩率 KV 路径</text>
  <text x="1595" y="2030" class="monoSmall">compressor:</text>
  <text x="1595" y="2065" class="monoSmall">[16,4096]×[4096,1024]</text>
  <text x="1595" y="2100" class="monoSmall">1024=2×coff(1)×head_dim(512)</text>
  <text x="1595" y="2150" class="monoSmall">extra cache [113444,2,1,584]</text>
  <text x="1595" y="2185" class="monoSmall">2=block_size 256 / ratio 128</text>
  <text x="1595" y="2235" class="monoSmall">capacity indices [16,1,1664]</text>
  <text x="1595" y="2270" class="monoSmall">ceil(200000/128)=1563 → 对齐到1664</text>
  <text x="1595" y="2305" class="small">调用：20/rank，整个文件 160</text>

  <!-- Cache explanation -->
  <rect x="390" y="2445" width="1420" height="170" class="box runtime"/>
  <text x="1100" y="2488" text-anchor="middle" class="head">KV Cache Shape 为什么是 584 / 113444？</text>
  <text x="1100" y="2528" text-anchor="middle" class="mono">584 B/token = 448B NoPE FP8 + 64×2B RoPE BF16 + 8B scale/pad</text>
  <text x="1100" y="2564" text-anchor="middle" class="monoSmall">[113444,37376] 是展平页：37376=64×584；113444 是本次运行分配的 cache block 容量</text>
  <text x="1100" y="2593" text-anchor="middle" class="small">113444、[78,8]、[17] 属于容量/FlashMLA 调度信息，不是隐藏维度或上下文长度</text>

  <!-- Three layer types first explain their cache geometry, then merge into Attention -->
  <path d="M350 2320 L350 2530 L390 2530" class="branch"/>
  <path d="M1100 2380 L1100 2445" class="branch"/>
  <path d="M1850 2320 L1850 2530 L1810 2530" class="branch"/>
  <path d="M1100 2615 L1100 2710" class="branch"/>
  <rect x="410" y="2710" width="1380" height="185" class="box attention"/>
  <text x="1100" y="2752" text-anchor="middle" class="head">FlashMLA · _flashmla_C::sparse_decode_fwd</text>
  <text x="1100" y="2792" text-anchor="middle" class="mono">Q [16,1,64,512] + SWA indices [16,1,128] + 可选 compressed indices</text>
  <text x="1100" y="2829" text-anchor="middle" class="monoSmall">逻辑 local_heads=8，但 kernel pad_heads=64；输出随后只保留前 8 heads</text>
  <text x="1100" y="2863" text-anchor="middle" class="small">所有 shape 合计：43/rank，整个文件 344；首个层类型还负责初始化 scheduler</text>

  <path d="M1100 2895 L1100 2950" class="line"/>
  <rect x="475" y="2950" width="1250" height="215" class="box attention"/>
  <text x="1100" y="2993" text-anchor="middle" class="head">Attention 输出投影</text>
  <text x="1100" y="3033" text-anchor="middle" class="mono">fused_inv_rope_fp8_quant: [16,8,512] + RoPE [1048576,64]</text>
  <text x="1100" y="3070" text-anchor="middle" class="monoSmall">wo_a：8 heads×512 → 本 rank o_lora 1024</text>
  <text x="1100" y="3107" text-anchor="middle" class="mono">wo_b: [16,1024] × [4096,1024] → partial [16,4096]</text>
  <text x="1100" y="3140" text-anchor="middle" class="small">这与 wq_b 的物理 shape 相同，所以按 operator+shape 聚合后两者合并为 86/rank</text>

  <path d="M1100 3165 L1100 3220" class="line"/>
  <rect x="660" y="3220" width="880" height="120" class="box comm"/>
  <text x="1100" y="3265" text-anchor="middle" class="head">每层第 1 次 All‑Reduce：Attention TP 输出</text>
  <text x="1100" y="3305" text-anchor="middle" class="mono">8 × partial [16,4096] → replicated [16,4096]</text>

  <path d="M1100 3340 L1100 3395" class="line"/>
  <rect x="555" y="3395" width="1090" height="145" class="box compute"/>
  <text x="1100" y="3435" text-anchor="middle" class="head">每层（43 次）：Attention→FFN fused post-pre + FFN RMSNorm</text>
  <text x="1100" y="3472" text-anchor="middle" class="monoSmall">input: x_attn_out [16,4096] + residual [16,4,4096]</text>
  <text x="1100" y="3501" text-anchor="middle" class="monoSmall">output: residual′ [16,4,4096] + post′ [16,4,1] + comb′ [16,4,4] + x_ffn [16,4096]</text>
  <text x="1100" y="3528" text-anchor="middle" class="small">L0 首例 Events #551–#566；两颗融合 GPU kernel 没有独立 CPU Events sequence</text>

  <path d="M1100 3540 L1100 3595" class="line"/>
  <rect x="520" y="3595" width="1160" height="175" class="box moe"/>
  <text x="1100" y="3638" text-anchor="middle" class="head">MoE Router · vllm::moe_forward_shared</text>
  <text x="1100" y="3678" text-anchor="middle" class="mono">router scores [16,256] → top‑6 IDs/weights [16,6]</text>
  <text x="1100" y="3715" text-anchor="middle" class="monoSmall">最大 routed assignments = B×top_k = 16×6 = 96</text>
  <text x="1100" y="3745" text-anchor="middle" class="small">前 3 个 hash layer 还出现 token→expert 表 [vocab,top_k]=[129280,6]</text>

  <!-- MoE branches -->
  <path d="M1100 3770 L1100 3820 L500 3820 L500 3860" class="branch"/>
  <path d="M1100 3770 L1100 3820 L1700 3820 L1700 3860" class="branch"/>

  <rect x="70" y="3860" width="870" height="420" class="box moe"/>
  <text x="505" y="3905" text-anchor="middle" class="head">Routed Experts · EP8：每 rank 32 个专家</text>
  <text x="100" y="3948" class="monoSmall">moe_align_block_size: topk [16,6]，最多96条路由</text>
  <text x="100" y="3990" class="monoSmall">W13 Marlin:</text>
  <text x="100" y="4025" class="monoSmall">[16,4096] → routed [96,4096=2×2048]</text>
  <text x="100" y="4060" class="monoSmall">packed weight [32,256,8192]</text>
  <text x="100" y="4105" class="monoSmall">SwiGLU：routed [96,4096] → [96,2048]</text>
  <text x="100" y="4150" class="monoSmall">W2 Marlin：[96,2048] → [96,4096]</text>
  <text x="100" y="4185" class="monoSmall">packed weight [32,128,8192]</text>
  <text x="100" y="4230" class="monoSmall">moe_sum: [16,6,4096] → local [16,4096]</text>
  <text x="100" y="4260" class="small">32 是 256/EP8；其余 Marlin 权重维度是 FP4 packed 布局</text>

  <rect x="1260" y="3860" width="870" height="420" class="box moe"/>
  <text x="1695" y="3905" text-anchor="middle" class="head">1 个 Shared Expert · TP8 切 intermediate</text>
  <text x="1290" y="3955" class="monoSmall">global intermediate = 2048</text>
  <text x="1290" y="3995" class="monoSmall">local intermediate = 2048/8 = 256</text>
  <text x="1290" y="4040" class="monoSmall">gate_up:</text>
  <text x="1290" y="4075" class="monoSmall">[16,4096] × [512,4096] → [16,512]</text>
  <text x="1290" y="4110" class="monoSmall">512=2×256；FP8 scale [4,32]</text>
  <text x="1290" y="4155" class="monoSmall">silu_and_mul: [16,512] → [16,256]</text>
  <text x="1290" y="4200" class="monoSmall">down:</text>
  <text x="1290" y="4235" class="monoSmall">[16,256] × [4096,256] → partial [16,4096]</text>
  <text x="1290" y="4265" class="small">shared expert 是 TP shard；routed expert 是 EP shard</text>

  <path d="M505 4280 L505 4340 L1100 4340 L1100 4380" class="branch"/>
  <path d="M1695 4280 L1695 4340 L1100 4340 L1100 4380" class="branch"/>
  <rect x="615" y="4380" width="970" height="105" class="box moe"/>
  <text x="1100" y="4422" text-anchor="middle" class="head">合并 routed + shared partial output</text>
  <text x="1100" y="4460" text-anchor="middle" class="mono">local MoE result [16,4096]</text>

  <!-- Loop arrow exits cluster and returns -->
  <path d="M1100 4485 L1100 4540" class="line"/>
  <rect x="660" y="4540" width="880" height="120" class="box comm"/>
  <text x="1100" y="4585" text-anchor="middle" class="head">每层第 2 次 All‑Reduce：MoE EP/TP 输出</text>
  <text x="1100" y="4625" text-anchor="middle" class="mono">8 × local [16,4096] → replicated [16,4096]</text>

  <path d="M1540 4600 L2120 4600 L2120 1450 L2080 1450" class="loop"/>
  <text x="2095" y="4505" text-anchor="end" class="small">L0–L41：42 次层间回环</text>
  <text x="1125" y="4695" class="small">L42：退出循环</text>

  <!-- Tail -->
  <path d="M1100 4660 L1100 4720" class="line"/>
  <rect x="500" y="4720" width="1200" height="150" class="box compute"/>
  <text x="1100" y="4765" text-anchor="middle" class="head">完成 L42 → HC Head / Final RMSNorm</text>
